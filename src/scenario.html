<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поранений · Casualty — Сценарій 07 — Перший Крок</title>
<meta name="description" content="Scenario lesson: a casualty call in Ukrainian. Listen to each line, repeat it, and unlock the next one.">
<meta name="pk-build" content="{{BUILD_COMMIT_FULL}}">
<meta name="theme-color" content="#141517">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="/data.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>

<header class="topbar">
  <a class="mark" href="/" aria-label="Перший Крок — home"><span>ПК</span></a>
  <a class="wordmark" href="/">Перший Крок</a>
  <nav aria-label="Primary">
    <a href="/glossary">Словник</a>
    <a href="/course">Курс</a>
    <a href="/scenario" aria-current="page">Сценарії</a>
  </nav>
  <button class="lang" type="button">EN ▾</button>
</header>

<main class="wrap">
  <div class="scenario-head">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="kicker" id="scen-kicker"></span>
      <h1 id="scen-title"></h1>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
      <span class="note mono" id="phrase-count" style="color:var(--grey-2)"></span>
      <div class="meter"><i id="meter" style="width:0%"></i></div>
    </div>
  </div>

  <div class="scenario">
    <div class="script" id="script"></div>

    <aside class="aside">
      <div class="keyterms">
        <span class="kicker" style="color:var(--blue-pale)">Ключові слова · Key terms</span>
        <ul id="keyterms"></ul>
      </div>
      <div class="drill">
        <span class="kicker" style="color:var(--grey-3)">Швидкий дрил · Quick drill</span>
        <span class="q" id="drill-q"></span>
        <div id="drill-options" style="display:flex;flex-direction:column;gap:6px"></div>
        <span class="verdict" id="drill-verdict"></span>
      </div>
      <a href="/course" id="next-scen" style="font:600 14px var(--sans);color:var(--yellow);text-align:right;text-decoration:none">Наступний сценарій →</a>
    </aside>
  </div>
</main>

<footer class="site-foot">
  <span>Перший Крок · {{YEAR}} — free for volunteers and instructors.</span>
  <a class="build" href="/build-info.json" data-env="{{BUILD_ENV}}" data-built-at="{{BUILD_TIME}}"
     title="branch {{BUILD_BRANCH}} · commit {{BUILD_COMMIT_FULL}} · built {{BUILD_TIME}}">
    <span class="dot"></span><span>build {{BUILD_STAMP}}</span> <span class="rel" data-build-rel></span>
  </a>
</footer>

<nav class="tabbar" aria-label="Mobile">
  <a href="/"><span class="ico">⌂</span>Головна</a>
  <a href="/glossary"><span class="ico">≡</span>Словник</a>
  <a href="/scenario" aria-current="page"><span class="ico">▷</span>Сценарії</a>
  <a href="/course"><span class="ico">✓</span>Прогрес</a>
</nav>

</body>
</html>
